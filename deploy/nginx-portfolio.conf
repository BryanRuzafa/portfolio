# Bloque para el server de bryanrg.dev en nginx (dentro del server { listen 443 ssl; ... }).
# Sustituye el "root /var/www/..." actual por este proxy al contenedor.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # El límite de envíos del formulario usa esta cabecera para saber la IP real.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
